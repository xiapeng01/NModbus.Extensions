name: NuGet Package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC：供 nuget.org Trusted Publishing 换取临时 API key（仅发布步骤使用）

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore NModbus.Extensions/NModbus.Extensions.csproj

    - name: Build
      run: dotnet build NModbus.Extensions/NModbus.Extensions.csproj --configuration Release /p:EnableWindowsTargeting=true --no-restore

    # 字节序往返回归测试：不依赖外部库，进程内 TCP 主从对，PR 与 push 都必须通过
    - name: Test
      run: dotnet test NModbus.Extensions.Tests/NModbus.Extensions.Tests.csproj --configuration Release /p:EnableWindowsTargeting=true --nologo

    - name: Pack
      run: dotnet pack NModbus.Extensions/NModbus.Extensions.csproj --configuration Release --output dist --no-build --no-restore

    # 仅 push 到 master 才发布；PR 只构建+测试，避免未评审代码直接发到 NuGet.org
    # （同仓库分支的 PR 也能读到 secrets，故必须显式限制事件类型）
    #
    # 发布使用 nuget.org Trusted Publishing（OIDC 短期 key，1 小时有效，无需再维护长期 API key）。
    # 前置配置（nuget.org 网页，一次性）：
    #   右上角用户名 → Trusted Publishing → Add new policy：
    #     Policy Owner: <你的 nuget.org 账号>
    #     Repository Owner: xiapeng01    Repository: NModbus.Extensions
    #     Workflow File: main.yml        （只填文件名，不要带 .github/workflows/ 前缀）
    #     Environment: 留空              Package Scopes: NModbus.Extensions，勾选 Push
    # 另需在仓库 Settings → Secrets and variables → Actions → Variables 添加：
    #   NUGET_USER = nuget.org 用户名（profile name，不是邮箱）
    - name: NuGet login (OIDC → temporary API key)
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish NuGet package
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: dotnet nuget push dist/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
